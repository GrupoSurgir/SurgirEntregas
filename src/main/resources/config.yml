# =====================================================================
# SURGIRENTREGAS - Configuracion principal
# =====================================================================

# Prefijo que aparece antes de los mensajes en chat.
prefix: "<dark_gray><bold>SURGIR</bold></dark_gray> <gray>|</gray> "

# Precios
# Recompensa GLOBAL por defecto cuando se entrega un item.
# Valor por defecto: 2000 ($2k).
price:
  global: 2000
  # Recompensa final al completar las 3 entregas del ciclo (logro).
  final: 2000
  # Precios unicos por material (opcional). Si un material no esta listado,
  # se usa el precio global. La clave debe ser el nombre del Material.
  per-item:
    DIAMOND: 5000
    NETHERITE_INGOT: 50000
    NETHER_STAR: 25000
    TOTEM_OF_UNDYING: 25000
    ELYTRA: 30000
    ENCHANTED_GOLDEN_APPLE: 15000

# Economia
# Tipos soportados: VAULT, PLAYERPOINTS, COMMAND, VAULT_COMMAND, NONE
# - VAULT: usa Vault Economy (requiere Vault + plugin economico).
# - PLAYERPOINTS: usa PlayerPoints (detecta plugin PlayerPoints).
# - COMMAND: ejecuta comandos configurados como recompensa.
# - VAULT_COMMAND: intenta Vault y si falla ejecuta comandos.
economy:
  type: VAULT
  # Comandos que se ejecutan al entregar (si type es COMMAND o fallback).
  # Placeholders: %player%, %reward%, %amount%
  commands:
    - "eco give %player% %reward%"
  # Comandos para la recompensa FINAL (al completar 3 entregas).
  final-commands:
    - "eco give %player% %reward%"
    - "say %player% completo las 3 entregas!"

# Temporizadores de rotacion
# Tiempo entre cada rotacion automatica de entregas.
# Formatos admitidos: "1h", "30m", "1h30m", segundos puros.
timer:
  rotation: 20m
  # Minutos entre anuncios al cambiar la entrega.
  announcement-cooldown: 5
  # Step por defecto del ajuste manual desde el menu admin (segundos).
  manual-step: 60

# Ordenamiento por defecto
# POR_MATERIALES = orden alfabetico del pool.
# ORDEN_DEL_COFRE = orden en que los items fueron colocados en el cofre.
# ALEATORIO = posiciones aleatorias al regenerar ciclo.
default-order:
  mode: POR_MATERIALES

# Modo de precio por defecto
# GLOBAL = siempre usa price.global.
# UNICO = usa price.per-item cuando exista; si no, price.global.
default-price-mode: GLOBAL

# Mensajes de Action Bar
# Cadenas que se envian por Action Bar en eventos especificos.
# Se permite MiniMessage (etiquetas <...>) o codigos '&' clasicos.
action-bar:
  # Cuando el jugador abre el menu.
  open: "<gray>Bienvenido a <bold>Entregas</bold>.</gray>"
  # Cuando completa una entrega.
  delivered: "<gray>Entrega completada.</gray> <white>+%reward%</white>"
  # Cuando no tiene materiales.
  no-items: "<gray>Necesitas los materiales para entregar.</gray>"
  # Cuando ya entrego el lote del ciclo actual.
  already-done: "<gray>Ya entregaste el lote.</gray>"
  # Click sobre un slot de material (los slots ya no son entregables individuales).
  use-entrega: "<gray>Usa el boton ENTREGAR MATERIALES para reclamar.</gray>"
  # Cuando el admin cambia una configuracion.
  admin-changed: "<gray>Configuracion actualizada.</gray>"
  # Anuncio de cambio de ciclo.
  rotation: "<gray>Las entregas cambiaron.</gray>"

# Mensajes de Chat
messages:
  rotation-broadcast: "<prefix>Las /entregas cambiaron, vende tus items."
  no-items: "<prefix><gray>Te faltan materiales para esta entrega.</gray>"
  already-completed: "<prefix><gray>Ya completaste esta entrega. Espera al reinicio global.</gray>"
  delivered: "<prefix><gray>Entrega completada: +%reward%</gray>"
  final-achievement: "<prefix><white>LOGRO!</white> <white>Completaste las 3 entregas y recibiste <white>%reward%</white>.</white>"
  insufficient: "<prefix><gray>No tienes los items requeridos.</gray>"

# Cofre de rotacion
chest:
  # Tamano del cofre (siempre multiplo de 9). 54 = 6 filas.
  size: 54
  # Cantidad de items que se eligen por rotacion.
  per-rotation: 3
  # Titulo del cofre.
  title: "<dark_gray><bold>SURGIR</bold></dark_gray> <gray>|</gray> <white>Cofre de Rotacion</white>"

# Menu Config
# Toda la configuracion visual de menus se lee desde aqui.
# No se requiere la carpeta externa "menus/".
# Estructura: cada menu tiene "title", "size" y una lista de "buttons".
# Cada boton define: slot (int), material (string), amount (int),
# name (string opcional), lore (lista de strings opcional).
menu-config:
  player-menu:
    title: "<dark_gray><bold>SURGIR</bold></dark_gray> <gray>|</gray> <white>Entregas</white>"
    size: 27
    buttons:
      # Fila 0-10, 12, 14, 16-17, 19-25 = fondo oscuro
      - slot: 0-10
        material: BLACK_STAINED_GLASS_PANE
      - slot: 12
        material: BLACK_STAINED_GLASS_PANE
      - slot: 14
        material: BLACK_STAINED_GLASS_PANE
      - slot: 16-17
        material: BLACK_STAINED_GLASS_PANE
      - slot: 19-25
        material: BLACK_STAINED_GLASS_PANE
      # Entregas 1/2/3
      - slot: 11
        material: QUARTZ
        amount: 16
      - slot: 13
        material: CARROT
        amount: 64
      - slot: 15
        material: BARRIER
        name: "<white>Completada</white>"
      # Boton de entrega fraccionada (slot 18)
      - slot: 18
        material: LIME_DYE
        name: "<white>Disponible</white>"
      # Top (slot 26)
      - slot: 26
        material: NETHER_STAR
        name: "<white>TOP ENTREGAS</white>"

  admin-menu:
    title: "<dark_gray><bold>SURGIR</bold></dark_gray> <gray>|</gray> <white>Admin Entregas</white>"
    size: 45
    buttons:
      # Fila 0-10, 12, 14, 16-17, 19-25, 27, 35-44 = fondo oscuro
      - slot: 0-10
        material: BLACK_STAINED_GLASS_PANE
      - slot: 12
        material: BLACK_STAINED_GLASS_PANE
      - slot: 14
        material: BLACK_STAINED_GLASS_PANE
      - slot: 16-17
        material: BLACK_STAINED_GLASS_PANE
      - slot: 19-25
        material: BLACK_STAINED_GLASS_PANE
      - slot: 27
        material: BLACK_STAINED_GLASS_PANE
      - slot: 35-44
        material: BLACK_STAINED_GLASS_PANE
      # Entregas preview 1/2/3
      - slot: 11
        material: QUARTZ
        amount: 16
      - slot: 13
        material: CARROT
        amount: 64
      - slot: 15
        material: TOTEM_OF_UNDYING
      # Forzar reinicio global
      - slot: 18
        material: COMMAND_BLOCK
        name: "<white>Forzar reinicio global</white>"
      # Cofre de rotacion
      - slot: 28
        material: CHEST
        name: "<white>Gestionar items de entregas</white>"
      # + Tiempo
      - slot: 29
        material: LIME_DYE
        name: "<white>+</white>"
      # Unidad de tiempo
      - slot: 30
        material: RECOVERY_COMPASS
        name: "<white>TIEMPO</white>"
      # - Tiempo
      - slot: 31
        material: RED_DYE
        name: "<white>-</white>"
      # Gestion de economia (reemplaza cabezas)
      - slot: 32
        material: EMERALD
        name: "<white>Gestion de economia</white>"
      # Orden de items
      - slot: 33
        material: REPEATER
        name: "<white>Orden de items</white>"
      # Precio
      - slot: 34
        material: GOLD_INGOT
        name: "<white>Precio por entrega</white>"

# Top
top:
  enabled: true
  title: "<dark_gray><bold>SURGIR</bold></dark_gray> <gray>|</gray> <white>Top Entregas</white>"

# Fallback Autonomo Vanilla
# Lista por defecto de cultivos y minerales tipo Vanilla para cuando el
# cofre administrativo esta vacio. El plugin prioriza el cofre si tiene items,
# de lo contrario selecciona aleatoriamente de esta_pool.
fallback-pool:
  enabled: true
  # Cantidad de entregas a generar si el cofre esta vacio (1, 2 o 3)
  default-deliveries-count: 3
  items:
    # --- MINERALES ---
    - material: "RAW_IRON"
      min-amount: 8
      max-amount: 16
      reward: 2000
    - material: "RAW_GOLD"
      min-amount: 4
      max-amount: 8
      reward: 2000
    - material: "COAL"
      min-amount: 16
      max-amount: 32
      reward: 2000
    - material: "COPPER_INGOT"
      min-amount: 8
      max-amount: 16
      reward: 2000
    - material: "LAPIS_LAZULI"
      min-amount: 16
      max-amount: 32
      reward: 2000

    # --- CULTIVOS ---
    - material: "WHEAT"
      min-amount: 32
      max-amount: 64
      reward: 2000
    - material: "CARROT"
      min-amount: 32
      max-amount: 64
      reward: 2000
    - material: "POTATO"
      min-amount: 32
      max-amount: 64
      reward: 2000
    - material: "BEETROOT"
      min-amount: 32
      max-amount: 64
      reward: 2000

# Mantenimiento (Exclusivo de SurgirEntregas)
# El mantenimiento es una restriccion LOGICA INTERNA del plugin: NO modifica
# el estado del servidor, NO usa whitelist y NO expulsa/kickea jugadores.
maintenance:
  enabled: false
  bypass-permission: "surgirentregas.maintenance.bypass"
  messages:
    blocked-access: "<gray>[!] El sistema de entregas se encuentra en mantenimiento. Intenta mas tarde.</gray>"
    enabled-broadcast: "<gray>[!] SurgirEntregas ha entrado en modo Mantenimiento.</gray>"
    disabled-broadcast: "<gray>[!] Modo Mantenimiento finalizado.</gray>"
